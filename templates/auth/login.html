{% extends 'base.html' %}

{% block title %}Вход — Электронная библиотека{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-header bg-dark text-white text-center">
        <h4 class="mb-0"><i class="bi bi-door-open me-2"></i>Вход в систему</h4>
      </div>
      <div class="card-body p-4">
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="login" class="form-label fw-semibold">Логин</label>
            <input type="text" class="form-control" id="login" name="login"
                   autocomplete="username" autofocus required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Пароль</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" name="remember">
            <label class="form-check-label" for="remember">Запомнить меня</label>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-dark btn-lg">
              <i class="bi bi-box-arrow-in-right me-1"></i>Войти
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
